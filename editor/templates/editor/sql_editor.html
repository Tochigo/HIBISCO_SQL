<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compilador SQL Online</title>

  <!-- CodeMirror CSS desde CDN -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e5e7eb;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
      background: #020617;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2937;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    #editor-container {
      border: 1px solid #374151;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #0b1120;
    }

    .CodeMirror {
      height: 300px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    button {
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      background: #22c55e;
      color: #022c22;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .result-box {
      border-radius: 8px;
      background: #020617;
      border: 1px solid #374151;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 0.9rem;
      min-height: 80px;
      white-space: pre-wrap;
    }

    .result-title {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .status {
      font-size: 0.85rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Compilador SQL Online</h1>
    <div class="subtitle">
      Escribe una consulta SQL, presiona <strong>Ejecutar</strong> y mira los resultados.
      <br>
      <em>(Por ahora es solo frontend, sin ejecutar realmente en la base de datos.)</em>
    </div>

    <div id="editor-container">
      <textarea id="sql-editor">
SELECT *
FROM usuarios
WHERE activo = TRUE;
      </textarea>
    </div>

    <div class="actions">
      <button id="run-button">Ejecutar</button>
      <span id="status-text" class="status"></span>
    </div>

    <div class="result-title">Salida</div>
    <div id="result" class="result-box">
      Aquí se mostrarán los resultados simulados de la consulta.
    </div>
  </div>

  <!-- CodeMirror JS desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>

  <script>
    // Inicializar CodeMirror
    const editor = CodeMirror.fromTextArea(
      document.getElementById('sql-editor'),
      {
        mode: 'text/x-sql',
        lineNumbers: true,
        theme: 'eclipse',
        indentWithTabs: false,
        tabSize: 2,
        smartIndent: true,
      }
    );

    const runButton = document.getElementById('run-button');
    const resultBox = document.getElementById('result');
    const statusText = document.getElementById('status-text');

    runButton.addEventListener('click', () => {
      const sql = editor.getValue().trim();

      if (!sql) {
        resultBox.textContent = '⚠️ No has escrito ninguna consulta SQL.';
        statusText.textContent = '';
        return;
      }

      statusText.textContent = 'Simulando ejecución (backend pendiente)...';

      setTimeout(() => {
        resultBox.textContent =
          'Consulta recibida:\n\n' +
          sql +
          '\n\n💡 En la siguiente etapa, esto se enviará al servidor Django, ' +
          'se ejecutará en PostgreSQL y aquí verás filas reales.';
        statusText.textContent = '';
      }, 600);
    });
  </script>
</body>
</html>
